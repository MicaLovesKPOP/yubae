:root{color-scheme:light dark;--bg:#f5f3ef;--panel:#fffdfa;--ink:#252b30;--muted:#646c70;--line:#dfddd7;--soft:#f0eee8;--accent:#26584d;--accent-ink:#fff;--focus:#137b67;--shadow:0 2px 12px #2027250a}
@media(prefers-color-scheme:dark){:root{--bg:#171c20;--panel:#22282c;--ink:#e9e8e3;--muted:#b3b9bd;--line:#40484b;--soft:#30393c;--accent:#a4d7c7;--accent-ink:#163d34;--focus:#a4d7c7;--shadow:none}}
*{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45;font-size:15px}
button,input,textarea{font:inherit;color:inherit} button{border:1px solid var(--line);background:var(--panel);padding:.58rem .78rem;border-radius:9px;min-height:42px;cursor:pointer;line-height:1.25}button:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.43;cursor:not-allowed} button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}button[aria-pressed=true]{background:var(--soft);border-color:var(--focus);font-weight:650}.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}.primary:hover:not(:disabled){background:var(--accent);filter:brightness(.93)}
a{color:var(--focus);text-underline-offset:3px}h1,h2,p{margin:0}h1,h2{font-size:1.08rem;font-weight:680}p{margin:.55rem 0}.top{max-width:1250px;margin:auto;padding:18px clamp(12px,3vw,32px);display:flex;gap:16px;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.brand strong{font-size:1.22rem;letter-spacing:-.02em}.subtitle{display:block;font-size:.78rem;color:var(--muted)}.brandmark{font-family:Yubae,sans-serif;font-size:2rem;display:grid;place-items:center;height:48px;width:48px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.top-actions button{padding:.48rem .65rem}
main{max-width:1250px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 20px}#workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.muted{color:var(--muted);font-size:.84rem}.small-heading{font-size:.8rem;color:var(--muted);font-weight:650;margin:12px 0 6px}.glyph{font-family:Yubae,system-ui,sans-serif;font-weight:400;font-synthesis:none}
textarea,input[type=search]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;min-width:0}#editor{font-size:clamp(30px,4.2vw,43px);line-height:1.45;resize:vertical;min-height:160px;max-height:55vh;letter-spacing:.01em}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.edit-tools{margin:9px 0 12px}.edit-tools button{min-height:38px;font-size:.79rem;padding:.42rem .55rem}#count{margin-inline-start:auto}.forms{border-top:1px solid var(--line);padding:10px 0 8px}.forms-heading{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}.forms-heading strong{font-size:.86rem}#form-buttons button{min-height:40px;display:flex;align-items:center;gap:5px;font-size:.76rem;padding:5px 8px}#form-buttons .glyph{font-size:1.55rem}.gloss-box{margin:8px 0 14px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;font-weight:600;font-size:.88rem}#gloss{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.share-row{padding-top:4px}.share-row button{flex:1 1 auto}.share-row .primary{flex:1.4 1 auto}.hint{line-height:1.55;margin:.65rem 0 0}

async function makePNG(text){
